name: CI

on:
  push:
    branches: [main, "verify/*"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Typecheck, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Tests
        run: pnpm run test

      - name: Test Production Build
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
          BETTER_AUTH_SECRET: "ci-test-secret-at-least-32-characters-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          MIDTRANS_SERVER_KEY: "SB-Mid-server-testkey"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: "SB-Mid-client-testkey"
          NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "false"
          MIDTRANS_IS_PRODUCTION: "false"

  integration-test:
    name: PostgreSQL Integration & Concurrency
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: saas_starterkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saas_starterkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.14.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PostgreSQL Integration Tests
        run: pnpm run test:integration
        env:
          INTEGRATION_TEST_DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5432/saas_starterkit_test"
          NODE_ENV: "test"
          BETTER_AUTH_SECRET: "ci-integration-test-secret-at-least-32-characters-long"
          BETTER_AUTH_URL: "http://localhost:3000"
          MIDTRANS_SERVER_KEY: "SB-Mid-server-test-integration-key-32chars"
          NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: "SB-Mid-client-test-integration-key"
          NEXT_PUBLIC_MIDTRANS_IS_PRODUCTION: "false"
          MIDTRANS_IS_PRODUCTION: "false"
